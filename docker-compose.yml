version: "3.8"

services:
  quotex-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quotex-signal-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistent storage for browser session cookies and local storage
      - ./browser_profile:/app/browser_profile
      # Persistent model checkpoints
      - ./models:/app/models
      # Persistent rotating log files
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "main.py", "--mode", "signal"]

